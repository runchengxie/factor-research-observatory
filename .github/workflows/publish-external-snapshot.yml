name: Publish external Alpha 810 snapshot candidate

on:
  workflow_dispatch:
    inputs:
      snapshot_url:
        description: HTTPS URL for a candidate money-trees public snapshot
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Download and validate candidate
        env:
          SNAPSHOT_URL: ${{ inputs.snapshot_url }}
        run: |
          case "$SNAPSHOT_URL" in https://*) ;; *) echo "snapshot_url must use HTTPS" >&2; exit 1 ;; esac
          curl --fail --location --proto '=https' --tlsv1.2 "$SNAPSHOT_URL" -o candidate-alpha810.json
          python scripts/validate_external_snapshot.py candidate-alpha810.json --report snapshot-validation.json
          cp candidate-alpha810.json site/public/data/alpha810-snapshot.json
      - name: Validate public tree and build
        working-directory: site
        run: npm ci
      - name: Run public checks
        run: |
          python scripts/audit_public_release.py
          python -m unittest discover -s tests -v
          npm run build --prefix site
      - name: Open review PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/alpha810-${{ github.run_id }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$BRANCH"
          git add site/public/data/alpha810-snapshot.json
          git commit -m "chore: refresh Alpha 810 public snapshot"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: refresh Alpha 810 public snapshot" \
            --body "Automated candidate snapshot refresh. Public contract, disclosure audit, tests, and site build passed in GitHub Actions."
      - uses: actions/upload-artifact@v4
        with:
          name: alpha810-publication-validation
          path: snapshot-validation.json
